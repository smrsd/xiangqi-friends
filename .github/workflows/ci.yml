name: Verify
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/validate-artifact.mjs
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate server addresses
        shell: pwsh
        run: ./android/test.ps1
      - name: Build APK
        shell: pwsh
        run: ./android/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: xiangqi-friends-android-debug
          path: android/build/*.apk
